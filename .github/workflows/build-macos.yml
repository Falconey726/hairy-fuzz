name: Build macOS plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal: Apple Silicon + Intel)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Ad-hoc sign
        run: |
          ART="build/HairyFuzz_artefacts/Release"
          codesign --force --deep --sign - "$ART/AU/Hairy Fuzz.component"
          codesign --force --deep --sign - "$ART/VST3/Hairy Fuzz.vst3"

      - name: Validate the Audio Unit with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/HairyFuzz_artefacts/Release/AU/Hairy Fuzz.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i hfzz || true
          auval -strict -v aufx Hfzz Flcn

      - name: Package
        run: |
          mkdir -p dist/HairyFuzz
          cp -R "build/HairyFuzz_artefacts/Release/AU/Hairy Fuzz.component" dist/HairyFuzz/
          cp -R "build/HairyFuzz_artefacts/Release/VST3/Hairy Fuzz.vst3" dist/HairyFuzz/
          cp INSTALL.txt dist/HairyFuzz/

      - uses: actions/upload-artifact@v4
        with:
          name: HairyFuzz-macOS
          path: dist/HairyFuzz
